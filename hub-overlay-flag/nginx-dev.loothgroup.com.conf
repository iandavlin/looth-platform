server {
    listen 80;
    listen [::]:80;
    server_name dev.loothgroup.com;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location ^~ /.well-known/ { root /var/www/dev; try_files $uri =404; access_log off; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name dev.loothgroup.com;
    ssl_certificate     /etc/letsencrypt/live/dev.loothgroup.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/dev.loothgroup.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;
    root /var/www/dev;
    index index.php index.html;

    client_max_body_size 8000M;
    client_body_timeout 6000s;
    send_timeout 6000s;

    # Smart heartbeat — visible-tab mousemove/click/keydown only.
    # Mtime-bumps /var/log/nginx/heartbeat.log which the idle daemon watches.
    sub_filter '</head>' '<link rel="manifest" href="/manifest.json"><meta name="theme-color" content="#87986a"><script>(function(){try{var b=JSON.parse(localStorage.getItem("lg-set-boot")||"null");var r=document.documentElement,h=document.head||r;if(b){var v=b.vars||{},k;for(k in v)if(v.hasOwnProperty(k))r.style.setProperty(k,v[k]);if(b.theme)r.setAttribute("data-lguser-theme",b.theme);r.setAttribute("data-lguser-dark",b.dark?"1":"0");if(b.feed)r.setAttribute("data-lguser-feed",b.feed);if(b.font){r.style.setProperty("--lg-font-sans",b.font);r.style.setProperty("--lguser-font",b.font);}if(b.scale)r.style.fontSize=(b.scale*100)+"%";if(b.bubble)r.style.setProperty("--lguser-bubble",b.bubble);if(b.fontHref&&!document.getElementById("lg-boot-font")){var l=document.createElement("link");l.id="lg-boot-font";l.rel="stylesheet";l.href=b.fontHref;h.appendChild(l);}if(b.dark){var bg=b.bg||"#15171a",s=document.createElement("style");s.id="lg-boot-crit";s.textContent="html{background:"+bg+";color-scheme:dark}body{background:"+bg+"!important;color:"+(b.ink||"#e5e7e1")+"!important}.feed-page,.feed,main,.bb-layout,.bb-layout__main{background:"+bg+"!important}#site-header,.lg-chrome{background:#000!important}";h.appendChild(s);}}var hl=localStorage.getItem("lg-hub-layout");if(hl==="cards"||hl==="compact")hl="masonry";if(hl)r.setAttribute("data-lg-hublayout",hl);if(/^\/hub/.test(location.pathname)){r.className+=" lg-feed-booting";setTimeout(function(){r.classList.remove("lg-feed-booting");},1500);}if(window.matchMedia&&matchMedia("(min-width:641px)").matches&&!document.getElementById("lg-vt")){var vt=document.createElement("style");vt.id="lg-vt";vt.textContent="@view-transition{navigation:auto}::view-transition-old(root),::view-transition-new(root){animation-duration:.18s}";h.appendChild(vt);}}catch(e){}})();</script><style id="lg-smoothnav">html.lg-feed-booting .feed-page .feed{opacity:0}.feed-page .feed{transition:opacity .15s ease}</style><script src="/pwa.js?v=3" defer></script><script>(function(){var t=0;function hb(){if(document.visibilityState==="hidden")return;var n=Date.now();if(n-t<30000)return;t=n;navigator.sendBeacon("/__heartbeat")}["mousemove","click","keydown"].forEach(function(e){document.addEventListener(e,hb,{passive:true})});hb()}())</script></head>';
    sub_filter_once on;
    sub_filter_types text/html;

    location = /__heartbeat {
        access_log /var/log/nginx/heartbeat.log;
        return 204;
    }

    # PWA service worker must not be pinned by the static catch-all's
    # expires max, or browsers never pick up SW updates.
    location = /sw.js {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # PWA install: Chrome fetches the manifest + icons WITHOUT credentials,
    # so they must bypass the cookie gate or the install prompt never fires.
    # Public assets (app name + generic icons) — no secrets.
    location = /manifest.json { try_files $uri =404; }
    location ^~ /icons/        { try_files $uri =404; }

    # PWA bootstrap + JSON feeds must REVALIDATE. The static catch-all below sets
    # expires max on all .js/.json; /pwa.js has no version query, so without this
    # clients pin a stale bootstrap for 10y and never pick up Hub polish updates.
    location = /pwa.js {
        if ($loothdev_is_authorized != 1) { return 403; }
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }
    location = /shop-feed.json {
        if ($loothdev_is_authorized != 1) { return 403; }
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }


    # ----- Cookie gate -----
    # Token: qShCjBdCVXLie7wcQddsprkYj4SuaXu7UJeYAHHG (one-time claim URL sets cookie)
    # Devs visit /claim?t=TOKEN once per device → 1-year cookie
    # Bots / unauthenticated → 403

    set $loothdev_token "qShCjBdCVXLie7wcQddsprkYj4SuaXu7UJeYAHHG";
    set $loothdev_tester_token "05173177e1aef5b3cf3d2523e6c63d914da588a9";

    location = /claim {
        access_log off;
        if ($arg_t = $loothdev_token) {
            add_header Set-Cookie "loothdev_auth=$loothdev_token; Domain=.dev.loothgroup.com; Path=/; Max-Age=31536000; HttpOnly; Secure; SameSite=Lax" always;
            add_header Content-Type "text/plain";
            return 200 "Access granted. This device is now claimed for 1 year. Visit https://dev.loothgroup.com/";
        }
        return 200 "Claim endpoint. Use the URL from Ian.";
    }

    # Tester claim: short-lived (7 day) tester cookie. ?next=<path> redirects post-claim.
    # Separate cookie name (loothdev_tester) so dev cookies are never overwritten.
    location = /claim-tester {
        access_log off;
        if ($arg_t = $loothdev_tester_token) {
            add_header Set-Cookie "loothdev_tester=$loothdev_tester_token; Domain=.dev.loothgroup.com; Path=/; Max-Age=604800; HttpOnly; Secure; SameSite=Lax" always;
            return 302 $loothdev_tester_next;
        }
        add_header Content-Type "text/plain";
        return 200 "Tester claim endpoint. Use the link from the dev-control plugin.";
    }

    # Mailpit — local SMTP catcher web UI (cookie-gated like the other dev tools)
    location ^~ /mailpit/ {
        if ($cookie_loothdev_auth != $loothdev_token) { return 403; }
        proxy_pass http://127.0.0.1:8025;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Accept-Encoding "";
        proxy_read_timeout 86400s;
    }

    # ----- Exempt paths (no cookie required) -----

    # Stripe billing app + its API endpoints (own X-LGMS-Token + Stripe signature auth)
    location ^~ /billing {
        alias /srv/lg-stripe-billing/public;
        try_files $uri $uri/ @billing_rewrite;

        location ~ ^/billing/.*\.php$ {
            include snippets/fastcgi-php.conf;
            fastcgi_pass unix:/run/php/php8.3-fpm-lg-billing-dev.sock;
            fastcgi_read_timeout 60;
            fastcgi_param SCRIPT_FILENAME $request_filename;
        }
    }

    location @billing_rewrite {
        rewrite ^/billing/?(.*)$ /billing/index.php?/$1 last;
    }

    # WP↔billing server-to-server callbacks (shared-secret authed)
    # Direct FastCGI pass — skip fastcgi-php.conf snippet because it has a
    # try_files $fastcgi_script_name =404 check that fails for non-.php URIs.
    # We pass to WP's index.php directly and let WP route via REQUEST_URI.
    location ^~ /wp-json/lg-member-sync/ {
        include fastcgi.conf;
        fastcgi_param SCRIPT_FILENAME /var/www/dev/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_pass unix:/run/php/php8.3-fpm-looth-dev.sock;
        fastcgi_read_timeout 300;
    }

    location ^~ /wp-json/loothdev/ {
        include fastcgi.conf;
        fastcgi_param SCRIPT_FILENAME /var/www/dev/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_pass unix:/run/php/php8.3-fpm-looth-dev.sock;
        fastcgi_read_timeout 300;
    }

    # Internal service channel (poller <-> profile-app, shared-secret auth at PHP layer).
    location ^~ /wp-json/looth-internal/ {
        # Lockdown (Ian 2026-06-03): internal tier channel — localhost only.
        # whoami shim calls via https://127.0.0.1; defense-in-depth atop PHP shared-secret.
        allow 127.0.0.1;
        allow ::1;
        deny all;
        include fastcgi.conf;
        fastcgi_param SCRIPT_FILENAME /var/www/dev/index.php;
        fastcgi_param SCRIPT_NAME /index.php;
        fastcgi_pass unix:/run/php/php8.3-fpm-looth-dev.sock;
        fastcgi_read_timeout 300;
    }

    location = /robots.txt {
        try_files $uri =404;
    }

    # Thumbnail editor — has its own basic auth + rate limit on brute force
    location ^~ /thumb/ {
        alias /srv/thumb-app/;
        index editor.html index.php;
        client_max_body_size 60M;

        # Rate limit: 5 requests/minute per IP, allow short bursts of 10
        # Legit users opening the editor hit ~5-20 requests in burst then idle
        # Brute force pounding gets 503'd after burst exhausted
        limit_req zone=loothdev_thumb burst=10 nodelay;
        limit_req_status 429;

        auth_basic           "Thumbnail Editor";
        auth_basic_user_file /srv/thumb-app/.htpasswd;
        location ~ ^/thumb/\. { deny all; return 404; }

        location ~ ^/thumb/(assets|patterns|output)/.*\.php$ {
            return 403;
        }

        location ~ ^/thumb/api/(.*)$ {
            rewrite ^/thumb/api/(.*)$ /thumb/api.php?path=$1 last;
        }

        location ~ ^/thumb/.+\.php$ {
            include snippets/fastcgi-php.conf;
            fastcgi_pass unix:/run/php/php8.3-fpm-looth-dev.sock;
            fastcgi_read_timeout 300;
            fastcgi_param SCRIPT_FILENAME $request_filename;
            fastcgi_param REMOTE_USER $remote_user;
        }
    }

    # Static assets (only useful WITH cookie since the HTML linking them is gated)
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot|otf|mp4|webm)$ {
        if ($loothdev_is_authorized != 1) { return 403; }
        expires max;
        add_header Cache-Control "public, no-transform";
        access_log off;
        log_not_found off;
    }

    # Always-deny patterns
    location ~ /\.(?!well-known/) { deny all; }
    location ~* wp-config\.php$ { deny all; }

    # ----- lg-layout-v2 mockups + harness outputs (static, gated) -----
    # Browse architecture mockups + test snapshots from a real browser:
    #   https://dev.loothgroup.com/v2/mockup/render-pipeline.html
    #   https://dev.loothgroup.com/v2/mockup/editor-pipeline.html
    #   https://dev.loothgroup.com/v2/docs/README.md   (raw markdown)
    location ^~ /v2/ {
        if ($loothdev_is_authorized != 1) { return 403; }
        alias /home/ubuntu/projects/lg-layout-v2/;
        autoindex on;
        autoindex_exact_size off;
        default_type text/plain;
        types {
            text/html  html htm;
            text/css   css;
            application/javascript js;
            application/json json;
            image/png  png;
            image/jpeg jpg jpeg;
            image/svg+xml svg;
        }
        # Never execute PHP from here — these are docs + harness sources, not WP.
        location ~ \.php$ {
            if ($loothdev_is_authorized != 1) { return 403; }
            default_type text/plain;
        }
    }

    # ----- Chrome DevTools (CDP) — proxied to chrome-dev.service @ 127.0.0.1:9222 -----
    # Cookie-gated. Visit /cdp/ for the launcher (lists tabs + opens Inspector).
    # NB: Host header rewritten to 127.0.0.1:9222 because Chrome's CDP rejects
    # requests with any other Host as a security measure.

    location = /cdp/ {
        if ($loothdev_is_authorized != 1) { return 403; }
        alias /var/www/dev/cdp-launcher/;
        try_files /index.html =404;
    }

    location ^~ /cdp/ {
        if ($loothdev_is_authorized != 1) { return 403; }
        proxy_pass http://127.0.0.1:9222/;
        proxy_set_header Host "127.0.0.1:9222";
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
        proxy_buffering off;
    }

    # ----- Gated locations (everything else) -----
    # ----- Strangler apps (extracted to includes 2026-05-27) -----
    # Each strangler owns its own snippet under /etc/nginx/snippets/.
    # Source-of-truth copies live in each project's repo as nginx-snippet.conf.
    # Order matters where prefixes overlap; all three currently disjoint.
    # The catch-all `location /` below this is the WP fallback.
    include /etc/nginx/snippets/strangler-profile-app.conf;
    include /etc/nginx/snippets/strangler-archive-poc.conf;
    include /etc/nginx/snippets/strangler-bb-mirror.conf;
    include /etc/nginx/snippets/strangler-events.conf;
    include /etc/nginx/snippets/strangler-membership.conf;
    include /etc/nginx/snippets/lg-shared.conf;

    location = / {
        if ($loothdev_is_authorized != 1) { return 403; }
        return 302 /hub/;
    }

    location / {
        if ($loothdev_is_authorized != 1) { return 403; }
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        if ($loothdev_is_authorized != 1) { return 403; }
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm-looth-dev.sock;
        fastcgi_read_timeout 300;
    }

    access_log /var/log/nginx/dev.loothgroup.access.log;
    error_log  /var/log/nginx/dev.loothgroup.error.log;
}
