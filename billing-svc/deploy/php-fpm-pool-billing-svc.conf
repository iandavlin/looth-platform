; billing-svc — php-fpm pool for the internal tier endpoints on dev.
;
; ⚠ NOT INSTALLED this milestone (file only — proves the deploy shape). The
;   relocated user-context endpoint lands here at step 1.
;
; Install (coordinator, step 1):
;   sudo cp deploy/php-fpm-pool-billing-svc.conf /etc/php/8.3/fpm/pool.d/billing-svc.conf
;   sudo systemctl reload php8.3-fpm
;   (and: apt install php8.3-pgsql — §3i cutover checklist, easy to forget)

[billing-svc]
user = billing-svc
group = billing-svc

listen = /run/php/php8.3-fpm-billing-svc.sock
listen.owner = www-data
listen.group = www-data
listen.mode = 0660

pm = ondemand
pm.max_children = 4
pm.max_requests = 500
pm.process_idle_timeout = 10s

request_terminate_timeout = 30s

php_admin_value[error_log] = /var/log/php-fpm/billing-svc-error.log
php_admin_flag[log_errors] = on
php_admin_value[memory_limit] = 128M

catch_workers_output = yes

; Peer-auth DSN (no user/password) per §3i. The pg role identity comes from
; this pool's OS user (billing-svc). Pin search_path in code (Connection.php),
; not here.
env[LG_BILLING_SVC_DSN] = pgsql:host=/var/run/postgresql;dbname=looth

; Internal shared secret for loopback auth (hash_equals against the header).
; Path only — the file is mode 640 root:billing-svc, NOT readable by profile-app.
env[LG_INTERNAL_SECRET_FILE] = /etc/lg-internal-secret

; NOTE: NO Stripe keys in this pool's env. billing-svc's payment-credential
; handling (when Stripe activates) reads /etc/billing-svc/*.env as the service
; user — never exported to a web-facing pool, never reachable by profile-app.
