# nginx location for billing-svc's INTERNAL tier endpoints (design §5b-D).
#
# ⚠ NOT INSTALLED this milestone (file only). Lands at step 1 when the
#   relocated user-context endpoint goes live.
#
# HARD RULE (§5b-D): these endpoints are loopback/internal-ONLY. They must NEVER
# get a public location block. The pre-ship gate requires an off-box curl to
# prove they 403/refuse. No public location, no tier-mutation reachable without
# the internal shared secret.
#
# Mount under /billing-internal/ (NOT /billing/ — that is lg-stripe-billing).
# Access is restricted to loopback at the nginx layer AND re-checked by the app
# (hash_equals on X-LG-Internal-Auth) — defence in depth.

location ^~ /billing-internal/ {
    # Loopback-only. Reject anything not from the box itself.
    allow 127.0.0.1;
    allow ::1;
    deny all;

    alias /srv/billing-svc/public/;
    try_files $uri $uri/ @billing_svc_rewrite;

    location ~ ^/billing-internal/.*\.php$ {
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm-billing-svc.sock;
        fastcgi_read_timeout 30;
        fastcgi_param SCRIPT_FILENAME $request_filename;
    }
}

location @billing_svc_rewrite {
    rewrite ^/billing-internal/?(.*)$ /billing-internal/index.php?/$1 last;
}

# Endpoint inventory (for the coordinator's exempt-path / off-box-curl gate):
#   GET  /billing-internal/v1/user-context/{id}   — relocated tier read (step 1)
#   POST /billing-internal/v1/tier-grant          — tier write (step 2 ONLY)
# Both: internal secret required; both must 403 from off-box. NO public location
# block for either, EVER. No "location near me" / public data blocks here.
