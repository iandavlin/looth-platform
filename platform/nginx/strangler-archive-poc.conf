# ===== archive-poc — strangler for /front-page/ (discovery) + /archive/ (search) =====
# Owns: /front-page/ (discovery feed), /archive/ (search/browse),
#       /archive-poc/* (legacy aliases → 301), /archive-api/v0/* (read API)
# Source: /home/ubuntu/projects/archive-poc/
# FPM pool: php8.3-fpm-archive-poc.sock (frontend + read API)
#           php8.3-fpm-looth-dev.sock (loopback _sync, needs $wpdb)

# ----- /front-page/ — discovery feed (index.php) -----
location ^~ /front-page/ {
    if ($loothdev_is_authorized != 1) { return 403; }
    fastcgi_pass unix:/run/php/php8.3-fpm-archive-poc.sock;
    include fastcgi.conf;
    fastcgi_param SCRIPT_FILENAME /home/ubuntu/projects/archive-poc/web/index.php;
    fastcgi_param DOCUMENT_ROOT   /home/ubuntu/projects/archive-poc/web;
}

# ----- /archive/ — search & browse page (search.php) -----
location ^~ /archive/ {
    if ($loothdev_is_authorized != 1) { return 403; }
    fastcgi_pass unix:/run/php/php8.3-fpm-archive-poc.sock;
    include fastcgi.conf;
    fastcgi_param SCRIPT_FILENAME /home/ubuntu/projects/archive-poc/web/search.php;
    fastcgi_param DOCUMENT_ROOT   /home/ubuntu/projects/archive-poc/web;
}

# Static assets (CSS/JS/images) for both pages — served from /archive-poc/ path
# (the PHP files reference /archive-poc/archive.css etc.)
location ^~ /archive-poc/ {
    if ($loothdev_is_authorized != 1) { return 403; }
    alias /home/ubuntu/projects/archive-poc/web/;

    # Legacy redirects (check exact match first)
    location = /archive-poc/ {
        return 301 /front-page/$is_args$args;
    }
    location ^~ /archive-poc/search {
        return 301 /archive/$is_args$args;
    }

    # Block PHP execution on static tree
    location ~ \.php$ { return 403; }
}

# ----- archive-poc API -----
location ^~ /archive-api/v0/ {
    alias /home/ubuntu/projects/archive-poc/api/v0/;

    rewrite ^/archive-api/v0/search/?$           /archive-api/v0/search.php          last;
    rewrite ^/archive-api/v0/search-suggest/?$   /archive-api/v0/search-suggest.php  last;
    rewrite ^/archive-api/v0/item/?$             /archive-api/v0/item.php             last;
    rewrite ^/archive-api/v0/item/([0-9]+)/?$    /archive-api/v0/item.php?id=$1       last;
    rewrite ^/archive-api/v0/_sync/?$            /archive-api/v0/_sync.php            last;
    rewrite ^/archive-api/v0/_config/?$          /archive-api/v0/_config.php          last;

    location = /archive-api/v0/_sync.php {
        allow 127.0.0.1; allow ::1; deny all;
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm-looth-dev.sock;
        fastcgi_param SCRIPT_FILENAME $request_filename;
    }
    location = /archive-api/v0/_config.php {
        allow 127.0.0.1; allow ::1; deny all;
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm-archive-poc.sock;
        fastcgi_param SCRIPT_FILENAME $request_filename;
    }
    location ~ ^/archive-api/v0/(search|search-suggest|item|rows-more)\.php$ {
        if ($loothdev_is_authorized != 1) { return 403; }
        include snippets/fastcgi-php.conf;
        fastcgi_pass unix:/run/php/php8.3-fpm-archive-poc.sock;
        fastcgi_param SCRIPT_FILENAME $request_filename;
    }
}
